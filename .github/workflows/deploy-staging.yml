name: Deploy to Staging (GCP Cloud Run)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REGISTRY: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/taskflow
  API_SERVICE_NAME: taskflow-api-staging
  WEB_SERVICE_NAME: taskflow-web-staging
  CLOUD_SQL_INSTANCE: ${{ secrets.GCP_PROJECT_ID }}:${{ vars.GCP_REGION || 'us-central1' }}:taskflow-staging

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      api_image: ${{ steps.meta-api.outputs.image }}
      web_image: ${{ steps.meta-web.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev --quiet

      - name: Generate image tags
        id: meta-api
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Generate web image tag
        id: meta-web
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/web:${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        run: |
          docker build \
            --target production \
            --tag "${{ steps.meta-api.outputs.image }}" \
            apps/api
          docker push "${{ steps.meta-api.outputs.image }}"

      - name: Build and push Web image
        run: |
          docker build \
            --target production \
            --build-arg VITE_API_URL="${{ secrets.STAGING_API_URL }}" \
            --tag "${{ steps.meta-web.outputs.image }}" \
            apps/web
          docker push "${{ steps.meta-web.outputs.image }}"

  deploy-api:
    name: Deploy API to Cloud Run
    needs: [build-and-push, run-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE_NAME }}
          image: ${{ needs.build-and-push.outputs.api_image }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --add-cloudsql-instances=${{ env.CLOUD_SQL_INSTANCE }}
            --port=8000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --concurrency=80
            --timeout=60s
            --allow-unauthenticated
          env_vars: |
            TASKFLOW_DEBUG=false
            TASKFLOW_CORS_ORIGINS=${{ secrets.STAGING_WEB_URL }}
          secrets: |
            TASKFLOW_DATABASE_URL=taskflow-staging-db-url:latest
            TASKFLOW_JWT_SECRET_KEY=taskflow-staging-jwt-secret:latest

  run-migrations:
    name: Run Database Migrations
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update migration job image
        run: |
          gcloud run jobs update taskflow-migrate-staging \
            --region "${{ env.GCP_REGION }}" \
            --image "${{ needs.build-and-push.outputs.api_image }}"

      - name: Run Alembic migrations via Cloud Run Job
        run: |
          gcloud run jobs execute taskflow-migrate-staging \
            --region "${{ env.GCP_REGION }}" \
            --wait

  deploy-web:
    name: Deploy Web to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Web to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WEB_SERVICE_NAME }}
          image: ${{ needs.build-and-push.outputs.web_image }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --port=8080
            --memory=256Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --concurrency=200
            --timeout=30s
            --allow-unauthenticated

  smoke-test:
    name: Smoke Test
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get service URLs
        id: urls
        run: |
          API_URL=$(gcloud run services describe "${{ env.API_SERVICE_NAME }}" \
            --region "${{ env.GCP_REGION }}" \
            --format "value(status.url)")
          WEB_URL=$(gcloud run services describe "${{ env.WEB_SERVICE_NAME }}" \
            --region "${{ env.GCP_REGION }}" \
            --format "value(status.url)")
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "web_url=${WEB_URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test API health
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.urls.outputs.api_url }}/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "API health check passed"
              exit 0
            fi
            echo "Attempt $i: API returned $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "API health check failed after 5 attempts"
          exit 1

      - name: Smoke test Web
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.urls.outputs.web_url }}/")
          if [ "$STATUS" = "200" ]; then
            echo "Web smoke test passed"
          else
            echo "Web returned status $STATUS"
            exit 1
          fi
